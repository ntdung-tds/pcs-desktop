name: Bootstrap PCS edition source
on:
  push:
    branches: [main]
    paths:
      - 'bootstrap/edition-seed.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack-verify-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Extract authenticated edition seed
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, stat, zipfile
          src=Path('bootstrap/edition-seed.zip')
          if not src.exists():
              print('Seed already imported; no bootstrap work needed')
              raise SystemExit(0)
          expected='e70a355d189dedefa2899a9e0ab5e0afc7a3f12172f71cb123f42181c793c0a0'
          raw=src.read_bytes()
          assert hashlib.sha256(raw).hexdigest()==expected, 'Seed SHA-256 mismatch'
          with zipfile.ZipFile(src) as z:
              entries=z.infolist()
              assert len(entries)==7, 'Unexpected seed entry count'
              assert sum(i.file_size for i in entries)<100_000, 'Seed exceeds size limit'
              for i in entries:
                  p=PurePosixPath(i.filename)
                  assert not p.is_absolute() and len(p.parts)>0 and all(x not in ('','.', '..') for x in p.parts), 'Invalid path'
                  assert stat.S_IFMT(i.external_attr >> 16)!=stat.S_IFLNK, 'Symlink rejected'
                  assert i.file_size<40_000 and not i.is_dir(), 'Unexpected seed entry'
                  target=Path(i.filename)
                  content=z.read(i.filename)
                  if target.exists():
                      assert target.read_bytes()==content, f'Conflicting existing file {target}'
                  else:
                      target.parent.mkdir(parents=True,exist_ok=True)
                      target.write_bytes(content)
          src.unlink()
          Path('.github/workflows/bootstrap.yml').unlink()
          Path('bootstrap').rmdir()
          PY
      - name: Verify imported edition source
        run: |
          python VERIFY_SEED.py
          python -m unittest discover -s tests -v
      - name: Import full original PCS 2.1 distribution if Desktop
        if: ${{ github.repository == 'ntdung-tds/pcs-desktop' }}
        run: |
          python scripts/import_legacy.py
          (cd distribution/pcs21 && python VERIFY_PACKAGE.py)
          (cd distribution/pcs21 && node --test runtime/tools/pcs21.test.mjs)
      - name: Commit verified complete edition
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'feat: publish verified standalone PCS edition source'
            git push origin HEAD:main
          fi
