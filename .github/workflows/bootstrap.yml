name: Import authentic PCS Desktop 2.1 source
on:
  push:
    branches: [main]
    paths: ['bootstrap/edition-seed.zip']
permissions:
  contents: write
jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify pinned Git blob, safely extract all original files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, stat, zipfile
          src=Path('bootstrap/edition-seed.zip')
          raw=src.read_bytes()
          assert len(raw)==147753,'Original archive byte length mismatch'
          blob=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          assert blob=='8201829c941d32d6b1371b87b8ec01dbc1f8fd36','Original archive Git blob hash mismatch'
          with zipfile.ZipFile(src) as z:
              files=z.infolist()
              assert len(files)==103,'Unexpected original file count'
              assert sum(v.file_size for v in files)<3_000_000,'Unexpected archive size'
              for member in files:
                  p=PurePosixPath(member.filename)
                  assert not p.is_absolute() and len(p.parts)>0 and all(x not in ('','.','..') for x in p.parts),'Unsafe path'
                  assert stat.S_IFMT(member.external_attr>>16)!=stat.S_IFLNK,'Symlink rejected'
                  assert member.file_size<1_000_000 and not member.is_dir(),'Unexpected archive member'
                  target=Path('distribution/pcs21').joinpath(*p.parts)
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(z.read(member))
          src.unlink()
          Path('.github/workflows/bootstrap.yml').unlink()
          Path('bootstrap').rmdir()
          PY
      - name: Verify authentic source and toolkit tests
        shell: bash
        run: |
          cd distribution/pcs21
          python VERIFY_PACKAGE.py
          node --test runtime/tools/pcs21.test.mjs
      - name: Publish verified source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: import all 103 verified PCS Desktop 2.1 source files'
          git push origin HEAD:main
